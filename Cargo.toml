[package]
name = "phlex-tree"
version = "0.1.0"
edition = "2024"
description = "Map which Phlex views and components call each other, and what a branch changed"
license = "MIT"
repository = "https://github.com/rachelgraves/phlex-tree"
readme = "README.md"
keywords = ["phlex", "rails", "ruby", "components", "graph"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
owo-colors = "4.4.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
